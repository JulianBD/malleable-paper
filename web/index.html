<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>malleable-paper</title>
  <link rel="stylesheet" href="/house.css" />
</head>
<body>
  <main id="plane">
    <div id="frame-title"></div>
    <button class="frame-nav" id="fprev">‹</button>
    <button class="frame-nav" id="fnext">›</button>
    <div id="frames"></div>
  </main>

  <footer id="meta">
    <output id="log" aria-live="polite"></output>
    <form id="f">
      <button type="button" class="region" id="toggle">meta ▴</button>
      <div class="sep"></div>
      <button type="button" class="region" id="record">record ○</button>
      <div class="sep"></div>
      <input id="t" placeholder="message the paper" autocomplete="off" />
      <div class="sep"></div>
      <button id="b" type="submit" class="region">send</button>
      <span class="status" id="s"></span>
    </form>
  </footer>

  <script>
    // ——— boxes: grab body to move, grab a corner to resize ———
    // Bounds are the playground subframe; A and B collide with each other.
    // The corner contract: every box exposes 4 typed corners; a corner's
    // type declares which quadrant is solid. A bound applies only if you
    // approach it (direction guard), and axes resolve dominant-first.
    const plane = document.getElementById('plane');
    let playground = null; // set when a playground frame is built
    let sketch = false; // sketch frame: nodes/edges render, boxes don't collide
    let latest = []; // the folded event log — declared up top: foldGeometry runs at first frame build
    let edges = []; // folded paper.edge events (latest per id)
    // ——— incremental folds (unit 8): the keyed-merge monoid ———
    // Each fold is a monoid homomorphism: state = Map(key → letter), the
    // merge is latest-wins per key, and a fresh letter integrates in O(1)
    // at intake — the poll never re-scans the log. The maps are maintained
    // continuously (letters merge even while another frame is mounted);
    // foldNodes/foldEdges/foldGeometry are now PROJECTIONS of the state,
    // not re-integrations of history.
    const foldState = { nodes: new Map(), edges: new Map(), geom: new Map() };
    function applyLetter(e) {
      if (e.kind === 'node' && e.id) foldState.nodes.set(e.id, e);
      else if (e.kind === 'edge' && e.id) foldState.edges.set(e.id, e);
      else if ((e.kind === 'box_geometry' || e.kind === 'box_drag') && e.name && e.geom) foldState.geom.set(e.name, e.geom);
    }
    let link = null; // rubber-band gesture: { from, px, py }
    let verbAsk = null; // dropped arrow awaiting its verb: { from, to, el }
    const boxes = [
      { name: 'A', x: 40, y: 40, w: 200, h: 140 },
      { name: 'B', x: 0, y: 40, w: 200, h: 140 },
    ];
    let drag = null; // { i, mode, corner, px, py, start, cont }
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

    // ——— hydration: fold geometry events into the plane ———
    // No stored state (ruling 6): positions are derived from the log every
    // time the frame builds. box_drag samples throttle at 80ms and every
    // release follows with box_geometry, so last-event-per-name lands on
    // the release act. Unknown names are ignored — geometry applies to
    // whichever boxes the current frame provides (A/B, or folded nodes).
    function foldGeometry() {
      for (const b of boxes) {
        const v = foldState.geom.get(b.name);
        if (v) Object.assign(b, { x: v.x, y: v.y, w: v.w, h: v.h });
      }
    }

    // ——— the graph's first real fold: nodes and edges ———
    // Latest node per id → a box; latest edge per id → the edge layer.
    // Node geometry is owned by box_geometry acts (name = node id), so a
    // dragged node is just a box whose name is an id — one gesture machine.
    function foldNodes() {
      boxes.length = 0;
      // superseded re-emits fold to absent (identity survives; presence doesn't)
      for (const e of foldState.nodes.values()) {
        if (e.superseded) continue;
        const g = e.geom ?? { x: 40, y: 40, w: 180, h: 56 };
        boxes.push({ name: e.id, label: e.label, kind: e.node_kind, x: g.x, y: g.y, w: g.w, h: g.h });
      }
    }
    function foldEdges() {
      edges = [...foldState.edges.values()].filter((e) => !e.superseded);
    }

    // ——— pan/zoom (unit 9): the view is ephemeral presentation state ———
    // Model coordinates never change; a wrap div inside the playground carries
    // translate+scale, reset to identity on every frame build. Panning is an
    // empty-plane drag; zooming is the wheel, anchored at the cursor. Nothing
    // is logged: the view is not a fact about the domain, only about the eye.
    let view = { x: 0, y: 0, k: 1 };
    function applyView() {
      const w = playground?.querySelector('#panewrap');
      if (w) w.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
    }
    const toModel = (cx, cy) => { // screen → model (view-aware)
      const r = playground.getBoundingClientRect();
      return { x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k };
    };
    const toScreen = (x, y) => ({ x: x * view.k + view.x, y: y * view.k + view.y });
    function wrapOf() {
      let w = playground.querySelector('#panewrap');
      if (!w) { w = document.createElement('div'); w.id = 'panewrap'; playground.append(w); }
      return w;
    }
    plane.addEventListener('wheel', (e) => {
      if (!sketch || !playground) return;
      e.preventDefault();
      const m = toModel(e.clientX, e.clientY);
      view.k = Math.min(3, Math.max(0.3, view.k * Math.exp(-e.deltaY * 0.0012)));
      const r = playground.getBoundingClientRect();
      view.x = e.clientX - r.left - m.x * view.k;
      view.y = e.clientY - r.top - m.y * view.k;
      applyView();
    }, { passive: false });

    function render() {
      if (!playground) return; // geometry frame not mounted
      const wrap = wrapOf();
      // removal is reprojection too: a superseded node folds out of `boxes`,
      // and its element must leave the DOM (found by supersedeprobe)
      for (const el of playground.querySelectorAll('.box'))
        if (+el.dataset.i >= boxes.length) el.remove();
      boxes.forEach((b, i) => {
        let el = document.getElementById('box' + i);
        if (!el) {
          el = document.createElement('div');
          el.className = 'box';
          el.id = 'box' + i;
          el.dataset.i = i;
          const label = document.createElement('span');
          label.className = 'label';
          el.append(label);
          for (const c of ['nw', 'ne', 'sw', 'se']) {
            const h = document.createElement('div');
            h.className = 'handle';
            h.dataset.corner = c;
            el.append(h);
          }
          wrap.append(el);
        }
        // reproject EVERY render — a rename must reach an existing element's
        // label, not just a freshly created one (found by makeprobe)
        el.querySelector('.label').textContent = b.label ?? b.name ?? '';
        el.classList.toggle('sel', sketch && selected?.type === 'node' && selected.id === b.name);
        el.style.left = b.x + 'px';
        el.style.top = b.y + 'px';
        el.style.width = b.w + 'px';
        el.style.height = b.h + 'px';
      });
      renderEdges();
    }

    // the edge layer: SVG over the playground, lines between node centers.
    // Pure projection — it only reads `boxes` and `edges`, never writes.
    // selection is ephemeral presentation state — never an act until it
    // terminates in one (the differentiability test: a selection you act on
    // is a gesture; a selection you stare at stays free)
    let selected = null; // { type: 'node'|'edge', id }
    let checkPanel = null; // { ev, el } — evidence for a check mark, ephemeral
    let pathIds = []; // the reading chain — ephemeral; the composed sentence is the composition check

    function renderEdges() {
      if (!playground) return;
      let svg = document.getElementById('edgelay');
      if (!svg) {
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.id = 'edgelay';
        wrapOf().prepend(svg);
      }
      svg.setAttribute('width', playground.clientWidth);
      svg.setAttribute('height', playground.clientHeight);
      // ambiguity check: same source + same verb twice — the 'is' reading breaks
      const byVerb = new Map();
      for (const e of edges) {
        if (!e.label) continue;
        const k = e.from + '\u0000' + e.label;
        byVerb.set(k, (byVerb.get(k) ?? 0) + 1);
      }
      let html = '';
      for (const e of edges) {
        const a = boxes.find((b) => b.name === e.from), c = boxes.find((b) => b.name === e.to);
        const isSel = selected?.type === 'edge' && selected.id === e.id;
        if (!a && !c) continue; // both endpoints gone: nothing to draw from
        if (!a || !c) { // dangling — dashed stub from the box EDGE outward
          // (a center-out stub hides under the box itself: half-width ≥ 70)
          const s = a ?? c, miss = a ? e.to : e.from;
          const y1 = s.y + s.h / 2;
          const x1 = a ? s.x + s.w + 10 : s.x - 10; // just outside the box
          const dx = a ? 50 : -50;
          const bx = x1 + dx + (a ? 12 : -12);
          html += `<line${isSel ? ' class="dang sel"' : ' class="dang"'} x1="${x1}" y1="${y1}" x2="${x1 + dx}" y2="${y1}"/>`;
          html += `<line class="hit dangsel" data-ev="${esc(e.id)}" x1="${x1}" y1="${y1}" x2="${x1 + dx}" y2="${y1}"/>`;
          html += `<g class="badge" data-ev="${esc(e.id)}"><circle cx="${bx}" cy="${y1}" r="9"/><text x="${bx}" y="${y1 + 4}" text-anchor="middle">⊘</text></g>`;
          html += `<text class="dangtxt" x="${x1 + dx / 2}" y="${y1 - 6}" text-anchor="middle">${esc(miss)} is gone</text>`;
          continue;
        }
        const x1 = a.x + a.w / 2, y1 = a.y + a.h / 2, x2 = c.x + c.w / 2, y2 = c.y + c.h / 2;
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const onPath = pathIds.includes(e.id);
        const cls = (isSel || onPath) ? ` class="${isSel ? 'sel ' : ''}${onPath ? 'path' : ''}"` : '';
        // wide transparent hit-line makes edges clickable for selection
        html += `<line class="hit" data-ev="${esc(e.id)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
        html += `<line${cls} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
        if (e.label)
          html += `<text x="${mx}" y="${my - 4}" text-anchor="middle">${esc(e.label)}</text>`;
        else // bare arrow: legal, marked with a small dot
          html += `<circle class="mark" cx="${mx}" cy="${my}" r="3"/>`;
        if (e.label && byVerb.get(e.from + '\u0000' + e.label) > 1)
          html += `<text class="marktxt" x="${mx}" y="${my + 12}" text-anchor="middle">≈</text>`;
      }
      if (link) { // the rubber band — ephemeral, never logged
        const s = boxes.find((b) => b.name === link.from);
        if (s) html += `<line class="rubber" x1="${s.x + s.w / 2}" y1="${s.y + s.h / 2}" x2="${(link.px - playground.getBoundingClientRect().left - view.x) / view.k}" y2="${(link.py - playground.getBoundingClientRect().top - view.y) / view.k}"/>`;
      }
      // the reading strip: the composed sentence IS the composition check —
      // a path that reads grammatically is admissible; one that stumbles is
      // either a new insight or a badly-verb'd arrow. Ephemeral, never stored.
      let strip = document.getElementById('pathstrip');
      if (pathIds.length) {
        if (!strip) { strip = document.createElement('div'); strip.id = 'pathstrip'; playground.append(strip); }
        let sentence = '';
        let prevTo = null;
        for (const id of pathIds) {
          const e2 = edges.find((v) => v.id === id);
          if (!e2 || e2.superseded) continue;
          const fb = boxes.find((b) => b.name === e2.from), tb = boxes.find((b) => b.name === e2.to);
          if (!fb || !tb) continue;
          const verb = e2.label || 'relates to';
          if (!prevTo) sentence = (fb.label ?? fb.name) + ' ' + verb + ' ' + (tb.label ?? tb.name);
          else if (e2.from === prevTo) sentence += ', which ' + verb + ' ' + (tb.label ?? tb.name);
          else sentence += ' · (chain breaks: ' + (fb.label ?? fb.name) + ') ' + verb + ' ' + (tb.label ?? tb.name);
          prevTo = e2.to;
        }
        strip.textContent = sentence + ' — esc clears';
        strip.style.display = '';
      } else if (strip) strip.style.display = 'none';
      svg.innerHTML = html;
      // edge selection + check-evidence clicks (svg innerHTML kills listeners,
      // so delegate at the svg)
      svg.onclick = (ev) => {
        const hit = ev.target.closest('.hit, .badge, .dangsel');
        if (!hit) return;
        if (hit.classList.contains('badge')) { showCheck(hit.dataset.ev); return; }
        const e = edges.find((v) => v.id === hit.dataset.ev);
        if (e) {
          selected = { type: 'edge', id: e.id };
          // path-to-sentence: a click that continues the chain extends it;
          // an unconnected click starts a new reading. Escape clears.
          const last = pathIds.length ? edges.find((v) => v.id === pathIds[pathIds.length - 1]) : null;
          if (!last || last.to === e.from) {
            if (!pathIds.includes(e.id)) pathIds.push(e.id);
          } else pathIds = [e.id];
          renderEdges(); render();
        }
      };
    }

    // node inspector: right-click a node → its folded history inline (its
    // own log + incident edge events), newest first. The history functor as
    // a navigation gesture — every node carries its own explanation.
    function showNodeLog(id) {
      closeCheck();
      const evs = latest.filter((v) =>
        (v.kind === 'node' && v.id === id) ||
        (v.kind === 'box_geometry' && v.name === id) ||
        (v.kind === 'edge' && (v.from === id || v.to === id))).slice().reverse();
      const el = document.createElement('pre');
      el.className = 'checkpanel';
      el.textContent = evs.length
        ? evs.map((v) => JSON.stringify(v)).join('\n')
        : 'no history — this node has no events';
      playground.append(el);
      checkPanel = { el };
    }
    plane.addEventListener('contextmenu', (e) => {
      if (!sketch || !playground) return;
      e.preventDefault();
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const boxEl = hit?.closest?.('.box');
      if (boxEl) {
        const b = boxes[+boxEl.dataset.i];
        if (b) showNodeLog(b.name);
      } else closeCheck();
    });

    // check evidence: the history functor as error provenance — click a mark,
    // read the events that produced the offending structure
    function showCheck(edgeId) {
      closeCheck();
      const evs = latest.filter((v) => (v.kind === 'edge' && v.id === edgeId) || (v.kind === 'node' && (v.id === edgeId)));
      const el = document.createElement('pre');
      el.className = 'checkpanel';
      el.textContent = evs.map((v) => JSON.stringify(v)).join('\n') || 'no events found';
      playground.append(el);
      checkPanel = { el };
      setTimeout(closeCheck, 8000); // ephemeral — it is a look, not a fixture
    }
    function closeCheck() {
      if (!checkPanel) return;
      checkPanel.el.remove();
      checkPanel = null;
    }

    const yOver = (y0, y1, o) => y0 < o.y + o.h && o.y < y1;
    const xOver = (x0, x1, o) => x0 < o.x + o.w && o.x < x1;

    function tryMove(s, dx, dy) { // s = gesture-start geometry; returns final {x, y}
      const pw = drag.cont.clientWidth, ph = drag.cont.clientHeight;
      const others = sketch ? [] : boxes.filter((o) => o !== drag.target); // sketch: nodes float free, no corner contract
      // resolve the DOMINANT axis first, so the second axis's overlap test
      // sees the updated position — diagonal escapes aren't pinned by a
      // stale start-span overlap
      const clampX = (y0, y1) => {
        let x = s.x + dx;
        for (const o of others) {
          if (!yOver(y0, y1, o)) continue;
          if (dx > 0 && o.x >= s.x + s.w) x = Math.min(x, o.x - s.w);
          if (dx < 0 && o.x + o.w <= s.x) x = Math.max(x, o.x + o.w);
        }
        return clamp(x, 0, pw - s.w);
      };
      const clampY = (x0, x1) => {
        let y = s.y + dy;
        for (const o of others) {
          if (!xOver(x0, x1, o)) continue;
          if (dy > 0 && o.y >= s.y + s.h) y = Math.min(y, o.y - s.h);
          if (dy < 0 && o.y + o.h <= s.y) y = Math.max(y, o.y + o.h);
        }
        return clamp(y, 0, ph - s.h);
      };
      if (Math.abs(dx) >= Math.abs(dy)) {
        const x = clampX(s.y, s.y + s.h);
        return { x, y: clampY(x, x + s.w) };
      }
      const y = clampY(s.x, s.x + s.w);
      return { y, x: clampX(y, y + s.h) };
    }

    function tryResize(s, corner, dx, dy) { // returns final {x, y, w, h}
      const pw = drag.cont.clientWidth, ph = drag.cont.clientHeight;
      const others = boxes.filter((o) => o !== drag.target);
      const e = { x: s.x, y: s.y, r: s.x + s.w, b: s.y + s.h };
      let { x, y } = e, r = e.r, btm = e.b;
      if (corner.includes('e')) {
        r = e.r + dx;
        for (const o of others) if (yOver(e.y, e.b, o) && o.x >= e.r) r = Math.min(r, o.x);
        r = clamp(r, e.x + 20, pw);
      }
      if (corner.includes('w')) {
        x = e.x + dx;
        for (const o of others) if (yOver(e.y, e.b, o) && o.x + o.w <= e.x) x = Math.max(x, o.x + o.w);
        x = clamp(x, 0, e.r - 20);
      }
      if (corner.includes('s')) {
        btm = e.b + dy;
        for (const o of others) if (xOver(e.x, e.r, o) && o.y >= e.b) btm = Math.min(btm, o.y);
        btm = clamp(btm, e.y + 20, ph);
      }
      if (corner.includes('n')) {
        y = e.y + dy;
        for (const o of others) if (xOver(e.x, e.r, o) && o.y + o.h <= e.y) y = Math.max(y, o.y + o.h);
        y = clamp(y, 0, e.b - 20);
      }
      return { x, y, w: r - x, h: btm - y };
    }

    // ——— doc boxes: swipeable pseudocode / prose pages ———
    function makeDoc(el, pages, swipeable = true) {
      el.innerHTML = '<div class="page"></div>' +
        (swipeable ? '<button class="nav prev">‹</button><button class="nav next">›</button><div class="pager"></div>' : '');
      let page = 0;
      const show = (n) => {
        page = Math.max(0, Math.min(pages.length - 1, n));
        el.querySelector('.page').textContent = pages[page];
        const pager = el.querySelector('.pager');
        if (pager) pager.textContent = (page + 1) + '/' + pages.length;
      };
      const prev = el.querySelector('.prev'), next = el.querySelector('.next');
      if (prev) prev.addEventListener('click', () => show(page - 1));
      if (next) next.addEventListener('click', () => show(page + 1));
      el._show = show;
      el._pages = pages.length;
      show(0);
    }

    const PAGES = [
      `— gesture model —

on pointerdown(box):
  drag = { start: copy(box),
           mode: move | resize,
           corner }        // if a handle

on pointermove:
  dx = ptr.x - drag.px    // TOTAL since start
  geom' = clamp(drag.start, dx, dy)
                         // computed from START
  box := geom'            // never accumulates

on pointerup:
  drag = null             // no barrier persists`,
      `— corner types —

every box exposes 4 typed corners:

  NW   solid to the EAST
  NE   solid to the WEST
  SW   solid to the EAST
  SE   solid to the WEST

(and vertically: N corners
 are solid downward, S upward)

the frame is 4 more corners
at its edges — bounds are
just corners facing you`,
      `— move clamp —

resolve DOMINANT axis first;
the other axis then sees the
updated position.

x = start.x + dx
for o, vertical overlap:
  if dx>0 and o.x >= start.r:
    x = min(x, o.x - w)
  if dx<0 and o.x+o.w <= start.x:
    x = max(x, o.x + o.w)
x = clamp(x, 0, frameW - w)

then y, same shape.`,
      `— resize clamp —

only the moving edge changes;
the stationary edge anchors.

E edge: r = start.r + dx
  for o, vertical overlap,
      o east of us:
    r = min(r, o.x)
  r = clamp(r, start.x+20, frameW)

W, S, N symmetric. Min size
20px throughout.`,
      `— open corners —

flanked on BOTH axes at once,
no ordering escapes: the box
corner-locks until you drag
axis-pure. The honest fix is a
2D corner-contact resolve —
earned when a recorded
trajectory proves it matters.`,
    ];


    const CONTRACT = `The corner contract

A box is not a rectangle of area; it is four points with attitudes. Each corner carries a type — NW, NE, SW, SE — and the type declares which quadrant is solid: an NW corner is solid to its east, an NE to its west, an SW to its east, an SE to its west; north corners are solid downward, south corners upward.

A frame is just four more corners at its edges. So "bounds checking" and "collision" are the same operation: scan every corner that faces your direction of motion, and stop at the nearest one.

Two clauses make the contract honest:

Approach. A corner bounds you only if you approach it. A box sitting to your west never blocks your eastward drag, no matter how close — its east corners point the wrong way. The first draft of this page dropped that clause and boxes teleported; the corner type carries exactly this information, which is the point of typing corners at all.

Order. When a drag moves diagonally, the dominant axis resolves first, and the second axis then measures overlap against the updated position — so a box sliding up-and-out from beside a neighbor is free the moment its edge actually clears, not stuck until you release and re-grab.

One clause is still owed: a box flanked on both axes at once — one neighbor east, another south — can lock in a corner, because no ordering of two 1-dimensional resolutions escapes a 2-dimensional trap. The contract will close when a recorded trajectory earns the full corner-contact resolve: corners meeting corners, not edges sweeping spans.`;

    // ——— gestures: drag in the playground, swipe in doc boxes ———
    let swipe = null;
    plane.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.nav, .frame-nav')) return; // let the page buttons click —
      // .frame-nav too: the pan branch would capture the pointer and swallow
      // the arrow buttons' clicks in the sketch frame (found by panprobe)
      const docEl = e.target.closest('.box.doc');
      if (docEl) {
        if (!docEl.querySelector('.pager')) return; // not swipeable (reader)
        swipe = { el: docEl, px: e.clientX, page: +docEl.querySelector('.pager').textContent.split('/')[0] - 1 };
        plane.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
      const boxEl = e.target.closest('.box');
      if (!boxEl) {
        // empty-plane drag in the sketch = PAN (ephemeral). Edges and marks
        // own their own downs; asks/panels sit at screen level and are skipped.
        if (sketch && playground && !e.target.closest('#edgelay, .checkpanel, .verbin, #pathstrip')) {
          drag = { mode: 'pan', px: e.clientX, py: e.clientY, sx: view.x, sy: view.y };
          plane.setPointerCapture(e.pointerId);
          e.preventDefault();
        }
        return;
      }
      const i = +boxEl.dataset.i;
      // link gesture (sketch frame): grab a node's LABEL to draw an edge —
      // body drag moves it, label drag relates it. Tactile split, no modifier.
      if (sketch && e.target.closest('.label') && boxes[i]) {
        link = { from: boxes[i].name, px: e.clientX, py: e.clientY };
        plane.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
      const handle = e.target.closest('.handle');
      drag = handle

    const LANDSCAPE = `React, and what we built instead — the landscape

What React does. A component tree owns state in pieces (useState, useReducer); every setState schedules a re-render of the affected subtree; the framework re-runs your components, diffs the result against a virtual DOM, and commits the minimal set of real DOM mutations. The promise is declarativity: UI = f(state), and the framework owns the render loop so you never touch the DOM directly.

What the others do. Solid and Svelte 5 compile away the VDOM: state is fine-grained signals/runes, each with its own subscriber list, and a write to one cell updates exactly the DOM nodes that read it. Vue makes plain objects reactive with proxies. All of them share one assumption: state is in-memory, per-session, and ephemeral — persistence is a bolt-on (a store, a query cache, localStorage), never the state itself.

What we have. The page as it stands already is a hand-rolled reactive framework, one where the assumptions invert:

- the event log is the store — durable, external, shared, append-only
- the fold (when built) is the selector: state = fold(events)
- render() is the commit phase: imperatively patching styles from state
- the 2s poll is the subscription; ?since=N cursors are the diff protocol

So the question this frame holds: is the proposal (a) React (or Solid, or nothing) mounted over an event-log store — log as useSyncExternalStore, folds as selectors, components as projections; or (b) no framework at all — the DOM itself as a projection, boxes as materialized views of log events, gestures writing events directly? And the sub-questions that follow: where does 60Hz gesture state live if state is events (direct manipulation must not round-trip the log per frame — the gesture/act split we already ruled); who owns layout (CSS vs fold); and what hydration means when refresh re-folds the log into geometry.

Julian's proposal and the exploration belong in this frame — annotate, drag, and message; the discussion will be folded in as it happens.

RULING (07:44): vanilla, as an experiment. No framework, no CRDT library — home-roll both, tiny and purpose-built, because forcing the problems through plain JS is how the patterns fall out. The research reports become specs to reimplement, not code to import: automerge's change-unit semantics (id-addressed, property-scoped, LWW-per-property, multi-value registers) as the home-rolled merge target; yjs's state vectors as the diff protocol design; atproto's cursors and lexicons as transport and schema. Everything tonight already went this way by instinct — event store, mirror, collision contract, markdown renderer, frames, probe are all hand-rolled and all tiny. The ruling makes it policy.

THE THREE MACHINES (07:50): the system is layered orthogonal state machines — ENGINE (pi + extension: event hub, pub/sub, delivery semantics, session lifecycle — replaceable, proven by tonight's mid-session engine swap), PRESENTATION (global UI + per-widget: frames, drawers, gestures, chat composing), DOMAIN (the grammar of represented things: message pending→answered, box created→moved→renamed→deleted, tend states). They speak only in events; they tick at different granularities (poll / rAF / event-arrival); presentation never invents domain facts, engine never interprets them. Tonight's worst bugs were crossing violations — engine state (reply-owed) wearing presentation clothes, domain facts (pending/answered) with no machine to track them. The home-rolled framework is scaffolding for these three layers; React only ever addressed the middle one.`;

    // tiny markdown subset: code blocks, inline code, bold, italic, links, lists, tables, paragraphs
    function md(src) {
      let s = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      s = s.replace(/```([\s\S]*?)```/g, (_, code) => '<pre>' + code.replace(/^\n|\n$/g, '') + '</pre>');
      s = s.replace(/^(#{1,4}) (.+)$/gm, (_, h, t) => '<h' + (h.length + 1) + '>' + t + '</h' + (h.length + 1) + '>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      s = s.replace(/(^|\n)((?:- .*\n?)+)/g, (_, pre, list) =>
        pre + '<ul>' + list.trim().split('\n').map((l) => '<li>' + l.slice(2) + '</li>').join('') + '</ul>');
      // tables: | a | b | rows, second row a --- separator
      s = s.replace(/(^|\n)((?:\|[^\n]*\n?)+)/g, (_, pre, block) => {
        const rows = block.trim().split('\n').map((r) => r.split('|').slice(1, -1).map((c) => c.trim()));
        if (rows.length < 2 || !rows[1].every((c) => /^:?-{3,}:?$/.test(c))) return pre + block;
        const cell = (c, tag) => '<' + tag + '>' + c + '</' + tag + '>';
        let html = '<table><tr>' + rows[0].map((c) => cell(c, 'th')).join('') + '</tr>';
        for (const r of rows.slice(2)) html += '<tr>' + r.map((c) => cell(c, 'td')).join('') + '</tr>';
        return pre + html + '</table>';
      });
      return s.split(/\n{2,}/).map((p) =>
        /^<(ul|pre|table|h[2-5])/.test(p.trim()) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
    }

        if (ruling) {
          const pretty = Object.entries(ruling.picks || {}).map(([k, v]) => k + ': ' + v).join(' · ');
          html += '<p class="card-note">ruled: ' + esc(pretty || '—') + (ruling.note ? ' — ' + esc(ruling.note) : '') + '</p>';
        }
        el.innerHTML = html;
        const formEl = el.querySelector('form');
        if (formEl) formEl.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const picks = {};
          for (const f of c.form.fields) {
            const v = formEl.querySelector('input[name="' + f.ref + '"]:checked');
            if (v) picks[f.ref] = v.value;
          }
          const note = formEl.querySelector('textarea').value.trim();
          const final = ev.submitter?.dataset.final !== '0';
          await fetch('/act', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ kind: 'card_response', card: c.id, picks, note, final, actor: 'julian' }),
          });
          poll();
        });
        field.append(el);
      }
    }

    // ——— system frame: the system explaining itself, live ———
    async function renderSys() {
      const el = document.getElementById('sysframe');
      if (!el) return;
      let registry = [], queueInfo = { pending: 0, rejects: [] };
      try { registry = await (await fetch('/registry')).json(); } catch {}
      try { queueInfo = await (await fetch('/queue')).json(); } catch {}
      const counts = new Map();
      for (const e of latest) counts.set(e.kind, (counts.get(e.kind) || 0) + 1);
      const last = latest[latest.length - 1];

      let html = '<div class="sys">';

      html += '<h2>the log</h2>';
      html += '<p>One append-only file, <code>events.jsonl</code>. Every line is an event: ' +
        '<code>{ts, kind, actor?, …}</code>. Nothing else is authority — every state you see ' +
        'on any frame is folded from these lines, and refresh re-folds. ' +
        'Right now it holds <strong>' + latest.length + ' events</strong> across ' +
        counts.size + ' kinds:</p>';
      html += '<table><tr><th>kind</th><th>count</th><th>emitted by</th></tr>';
      const emitters = new Map();
      for (const lex of registry)
        for (const k of Object.keys(lex?.events?.emits ?? {}))
          emitters.set(k, lex.id);
      for (const [k, n] of [...counts.entries()].sort((a, b) => b[1] - a[1]))
        html += '<tr><td><code>' + esc(k) + '</code></td><td>' + n + '</td><td>' +
          esc(emitters.get(k) || '— pre-registry') + '</td></tr>';
      html += '</table>';
      if (last) html += '<p>latest line, verbatim:</p><pre>' + esc(JSON.stringify(last)) + '</pre>';

      html += '<h2>the schemas</h2>';
      html += '<p>One lexicon per object kind, in <code>schema/*.json</code>. Each declares the object\'s ' +
        '<strong>events</strong> (emits/consumes), its <strong>domain machine</strong> (fold, states, valid ' +
        'transitions, acts), its <strong>system tick</strong>, and its <strong>render projection</strong>. ' +
        'The queue enforces them at intake: an act whose kind no lexicon emits, or that is missing a ' +
        'required field, is rejected at drain. The registry is the grammar of what can happen.</p>';
      html += '<table><tr><th>lexicon</th><th>emits</th><th>fold</th><th>states</th><th>acts</th></tr>';
      for (const lex of registry) {
        const d = lex.domain ?? {};
        html += '<tr><td><code>' + esc(lex.id) + '</code></td>' +
          '<td>' + Object.keys(lex?.events?.emits ?? {}).map((k) => '<code>' + esc(k) + '</code>').join(', ') + '</td>' +
          '<td>' + esc(d.fold ?? '—') + '</td>' +
          '<td>' + Object.keys(d.states ?? {}).map((s) => '<code>' + esc(s) + '</code>').join(' → ') + '</td>' +
          '<td>' + Object.keys(d.acts ?? {}).map((a) => '<code>' + esc(a) + '</code>').join(', ') + '</td></tr>';
      }
      html += '</table>';

      html += '<h2>the machines</h2>';
      html += '<p>Frames do not contain objects — frames <em>project</em> them. The objects (the chat, boxes A/B, ' +
        'cards, the record button, the frame switcher itself) live in the log as event streams; each has exactly ' +
        'one domain machine folded from those events, wherever it appears. A frame is a choice of which machines ' +
        'to render. Nothing prevents one object from being projected on two frames, or zero.</p>';
      html += '<p>Each object runs three machines. <strong>Domain</strong>: data → infer → intend → act — fold the ' +
        'log into state, derive status, queue intents, emit acts. <strong>System</strong>: when it ticks and where ' +
        'it reads (the 2s poll, pointer events, page load). <strong>Render</strong>: a pure projection of domain ' +
        'state to the DOM, plus declared ephemera (drag-in-progress, scroll, the drawer) that never touch the log.</p>';
      html += '<p>Between intend and act sits <strong>the queue</strong> — this server. Widgets register acts; ' +
        'every 250ms a drain validates the batch against the registry, stamps commit-time ts, appends. ' +
        'The drain order <em>is</em> the log order. Pending now: ' + queueInfo.pending +
        ' · rejected so far: ' + queueInfo.rejects.length + '.</p>';
      if (queueInfo.rejects.length)
        html += '<pre>' + esc(queueInfo.rejects.map((r) => r.why + ': ' + (r.act?.kind ?? '?')).join('\n')) + '</pre>';

      html += '</div>';
      el.innerHTML = html;
    }

    let cursor = 0;
    async function poll() {
      try {
        const r = await (await fetch('/events?since=' + cursor)).json();
        const fresh = r.events;
        cursor = r.cursor;
        if (fresh.length) {
          latest = latest.concat(fresh);
          for (const e of fresh) applyLetter(e); // O(1) per letter — the fold integrates at intake
          // hydration live-half + graph live-half: new acts re-fold into the
          // active plane (skip mid-gesture — the gesture owns the box until
          // release; the rubber band owns the edge layer until drop)
          if (playground && !drag && !link) {
            if (sketch && fresh.some((e) => e.kind === 'node' || e.kind === 'edge')) {
              foldNodes();
              foldEdges();
              foldGeometry();
              render();
            } else if (fresh.some((e) => e.kind === 'box_geometry' || e.kind === 'box_drag')) {
              foldGeometry();
              render();
            }
          }
          renderCards();
          renderSys();
          syncFrames();
          const wasBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
          log.innerHTML = '';
          for (const e of latest) {
            if (e.kind !== 'human_message' && e.kind !== 'agent_message') continue;
            const p = document.createElement('p');
            p.className = 'msg ' + (e.kind === 'agent_message' ? 'agent' : 'human');
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = e.kind === 'agent_message' ? 'paper' : 'you';
            const body = document.createElement('span');
            body.className = 'body';
            body.innerHTML = md(e.text);
            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.textContent = e.ts.slice(11, 19);
            p.append(who, body, ts);
            log.append(p);
          }
          if (wasBottom || meta.classList.contains('open')) log.scrollTop = log.scrollHeight;
        }
      } catch {}
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
