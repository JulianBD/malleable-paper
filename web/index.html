<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>malleable-paper</title>
  <link rel="stylesheet" href="/house.css" />
</head>
<body>
  <main id="plane"></main>

  <footer id="meta">
    <output id="log" aria-live="polite"></output>
    <form id="f">
      <button type="button" class="toggle" id="toggle">meta ▴</button>
      <input id="t" placeholder="message the paper" autocomplete="off" />
      <button id="b" type="submit">send</button>
      <span class="status" id="s"></span>
    </form>
  </footer>

  <script>
    // ——— boxes: grab body to move, grab a corner to resize ———
    // Constraint model (Julian's): every box exposes 4 typed corners
    // (NE/NW/SE/SW). A corner's type says which quadrant is solid:
    // NW is solid to its east, NE to its west, SW to its east, SE to its
    // west (vertically likewise). Moving/resizing scans all corners —
    // other boxes' and the viewport's four — and clamps against the ones
    // that face the direction of motion.
    const plane = document.getElementById('plane');
    const boxes = [
      { x: 80, y: 80, w: 240, h: 160 },
      { x: 0, y: 80, w: 240, h: 160 }, // parked on the other side at init
    ];
    let drag = null; // { i, mode, corner, px, py, start }
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

    function render() {
      boxes.forEach((b, i) => {
        let el = document.getElementById('box' + i);
        if (!el) {
          el = document.createElement('div');
          el.className = 'box';
          el.id = 'box' + i;
          el.dataset.i = i;
          for (const c of ['nw', 'ne', 'sw', 'se']) {
            const h = document.createElement('div');
            h.className = 'handle';
            h.dataset.corner = c;
            el.append(h);
          }
          plane.append(el);
        }
        el.style.left = b.x + 'px';
        el.style.top = b.y + 'px';
        el.style.width = b.w + 'px';
        el.style.height = b.h + 'px';
      });
    }

    // does rect a span past box o in the given axis? (overlap check)
    const yOver = (y0, y1, o) => y0 < o.y + o.h && o.y < y1;
    const xOver = (x0, x1, o) => x0 < o.x + o.w && o.x < x1;

    function tryMove(s, dx, dy) { // s = gesture-start geometry; returns final {x, y}
      const pw = plane.clientWidth, ph = plane.clientHeight;
      const others = boxes.filter((o) => o !== drag.target);
      // x axis: west corners (NW/SW) bound eastward motion, east corners (NE/SE) westward
      let x = s.x + dx;
      for (const o of others) {
        if (!yOver(s.y, s.y + s.h, o)) continue;
        if (dx > 0) x = Math.min(x, o.x - s.w);
        if (dx < 0) x = Math.max(x, o.x + o.w);
      }
      x = clamp(x, 0, pw - s.w);
      // y axis, with x already applied: north corners bound downward motion, south corners upward
      let y = s.y + dy;
      for (const o of others) {
        if (!xOver(x, x + s.w, o)) continue;
        if (dy > 0) y = Math.min(y, o.y - s.h);
        if (dy < 0) y = Math.max(y, o.y + o.h);
      }
      y = clamp(y, 0, ph - s.h);
      return { x, y };
    }

    function tryResize(s, corner, dx, dy) { // returns final {x, y, w, h}
      const pw = plane.clientWidth, ph = plane.clientHeight;
      const others = boxes.filter((o) => o !== drag.target);
      const e = { x: s.x, y: s.y, r: s.x + s.w, b: s.y + s.h };
      let { x, y } = e, r = e.r, btm = e.b;
      if (corner.includes('e')) {
        r = e.r + dx;
        for (const o of others) if (yOver(e.y, e.b, o)) r = Math.min(r, o.x); // o's west corners
        r = clamp(r, e.x + 20, pw);
      }
      if (corner.includes('w')) {
        x = e.x + dx;
        for (const o of others) if (yOver(e.y, e.b, o)) x = Math.max(x, o.x + o.w); // o's east corners
        x = clamp(x, 0, e.r - 20);
      }
      if (corner.includes('s')) {
        btm = e.b + dy;
        for (const o of others) if (xOver(e.x, e.r, o)) btm = Math.min(btm, o.y); // o's north corners
        btm = clamp(btm, e.y + 20, ph);
      }
      if (corner.includes('n')) {
        y = e.y + dy;
        for (const o of others) if (xOver(e.x, e.r, o)) y = Math.max(y, o.y + o.h); // o's south corners
        y = clamp(y, 0, e.b - 20);
      }
      return { x, y, w: r - x, h: btm - y };
    }

    plane.addEventListener('pointerdown', (e) => {
      const boxEl = e.target.closest('.box');
      if (!boxEl) return;
      const i = +boxEl.dataset.i;
      const handle = e.target.closest('.handle');
      drag = handle
        ? { i, mode: 'resize', corner: handle.dataset.corner, px: e.clientX, py: e.clientY, start: { ...boxes[i] }, target: boxes[i] }
        : { i, mode: 'move', px: e.clientX, py: e.clientY, start: { ...boxes[i] }, target: boxes[i] };
      plane.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    plane.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
      const g = drag.mode === 'move'
        ? tryMove(drag.start, dx, dy)
        : tryResize(drag.start, drag.corner, dx, dy);
      Object.assign(boxes[drag.i], g);
      render();
    });

    plane.addEventListener('pointerup', (e) => {
      if (!drag) return;
      console.log('box' + drag.i, boxes[drag.i]);
      drag = null;
      plane.releasePointerCapture(e.pointerId);
    });

    // park the second box on the other side of the plane
    boxes[1].x = plane.clientWidth - boxes[1].w - 80;
    render();

    // ——— meta drawer (unchanged) ———
    const f = document.getElementById('f'),
          t = document.getElementById('t'),
          b = document.getElementById('b'),
          s = document.getElementById('s'),
          log = document.getElementById('log'),
          meta = document.getElementById('meta'),
          toggle = document.getElementById('toggle');

    toggle.addEventListener('click', () => {
      const open = meta.classList.toggle('open');
      toggle.textContent = open ? 'meta ▾' : 'meta ▴';
      if (open) log.scrollTop = log.scrollHeight;
    });

    t.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === '+') {
        e.preventDefault();
        if (e.shiftKey) f.requestSubmit();
      }
    });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = t.value.trim();
      if (!text) return;
      b.disabled = true; s.textContent = '…';
      try {
        const r = await fetch('/message', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error(await r.text());
        t.value = '';
        s.textContent = '✓';
        meta.classList.add('open');
        toggle.textContent = 'meta ▾';
      } catch (err) {
        s.textContent = 'failed';
      } finally {
        b.disabled = false;
        t.focus();
      }
    });

    // tiny markdown subset: code blocks, inline code, bold, italic, links, lists, paragraphs
    function md(src) {
      let s = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      s = s.replace(/```([\s\S]*?)```/g, (_, code) => '<pre>' + code.replace(/^\n|\n$/g, '') + '</pre>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      s = s.replace(/(^|\n)((?:- .*\n?)+)/g, (_, pre, list) =>
        pre + '<ul>' + list.trim().split('\n').map((l) => '<li>' + l.slice(2) + '</li>').join('') + '</ul>');
      return s.split(/\n{2,}/).map((p) =>
        /^<(ul|pre)/.test(p.trim()) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
    }

    let seen = -1;
    async function poll() {
      try {
        const events = await (await fetch('/events')).json();
        if (events.length > seen) {
          const wasBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
          seen = events.length;
          log.innerHTML = '';
          for (const e of events) {
            if (e.kind !== 'human_message' && e.kind !== 'agent_message') continue;
            const p = document.createElement('p');
            p.className = 'msg ' + (e.kind === 'agent_message' ? 'agent' : 'human');
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = e.kind === 'agent_message' ? 'paper' : 'you';
            const body = document.createElement('span');
            body.className = 'body';
            body.innerHTML = md(e.text);
            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.textContent = e.ts.slice(11, 19);
            p.append(who, body, ts);
            log.append(p);
          }
          if (wasBottom || meta.classList.contains('open')) log.scrollTop = log.scrollHeight;
        }
      } catch {}
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
