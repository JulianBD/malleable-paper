<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>malleable-paper</title>
  <link rel="stylesheet" href="/house.css" />
</head>
<body>
  <main id="plane">
    <div id="frame-title"></div>
    <button class="frame-nav" id="fprev">‹</button>
    <button class="frame-nav" id="fnext">›</button>
    <div id="frames"></div>
  </main>

  <footer id="meta">
    <output id="log" aria-live="polite"></output>
    <form id="f">
      <button type="button" class="region" id="toggle">meta ▴</button>
      <div class="sep"></div>
      <button type="button" class="region" id="record">record ○</button>
      <div class="sep"></div>
      <input id="t" placeholder="message the paper" autocomplete="off" />
      <div class="sep"></div>
      <button id="b" type="submit" class="region">send</button>
      <span class="status" id="s"></span>
    </form>
  </footer>

  <script>
    // ——— boxes: grab body to move, grab a corner to resize ———
    // Bounds are the playground subframe; A and B collide with each other.
    // The corner contract: every box exposes 4 typed corners; a corner's
    // type declares which quadrant is solid. A bound applies only if you
    // approach it (direction guard), and axes resolve dominant-first.
    const plane = document.getElementById('plane');
    let playground = null; // set when the geometry frame is built
    const boxes = [
      { name: 'A', x: 40, y: 40, w: 200, h: 140 },
      { name: 'B', x: 0, y: 40, w: 200, h: 140 },
    ];
    let drag = null; // { i, mode, corner, px, py, start, cont }
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

    function render() {
      if (!playground) return; // geometry frame not mounted
      boxes.forEach((b, i) => {
        let el = document.getElementById('box' + i);
        if (!el) {
          el = document.createElement('div');
          el.className = 'box';
          el.id = 'box' + i;
          el.dataset.i = i;
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = b.name ?? '';
          el.append(label);
          for (const c of ['nw', 'ne', 'sw', 'se']) {
            const h = document.createElement('div');
            h.className = 'handle';
            h.dataset.corner = c;
            el.append(h);
          }
          playground.append(el);
        }
        el.style.left = b.x + 'px';
        el.style.top = b.y + 'px';
        el.style.width = b.w + 'px';
        el.style.height = b.h + 'px';
      });
    }

    const yOver = (y0, y1, o) => y0 < o.y + o.h && o.y < y1;
    const xOver = (x0, x1, o) => x0 < o.x + o.w && o.x < x1;

    function tryMove(s, dx, dy) { // s = gesture-start geometry; returns final {x, y}
      const pw = drag.cont.clientWidth, ph = drag.cont.clientHeight;
      const others = boxes.filter((o) => o !== drag.target);
      // resolve the DOMINANT axis first, so the second axis's overlap test
      // sees the updated position — diagonal escapes aren't pinned by a
      // stale start-span overlap
      const clampX = (y0, y1) => {
        let x = s.x + dx;
        for (const o of others) {
          if (!yOver(y0, y1, o)) continue;
          if (dx > 0 && o.x >= s.x + s.w) x = Math.min(x, o.x - s.w);
          if (dx < 0 && o.x + o.w <= s.x) x = Math.max(x, o.x + o.w);
        }
        return clamp(x, 0, pw - s.w);
      };
      const clampY = (x0, x1) => {
        let y = s.y + dy;
        for (const o of others) {
          if (!xOver(x0, x1, o)) continue;
          if (dy > 0 && o.y >= s.y + s.h) y = Math.min(y, o.y - s.h);
          if (dy < 0 && o.y + o.h <= s.y) y = Math.max(y, o.y + o.h);
        }
        return clamp(y, 0, ph - s.h);
      };
      if (Math.abs(dx) >= Math.abs(dy)) {
        const x = clampX(s.y, s.y + s.h);
        return { x, y: clampY(x, x + s.w) };
      }
      const y = clampY(s.x, s.x + s.w);
      return { y, x: clampX(y, y + s.h) };
    }

    function tryResize(s, corner, dx, dy) { // returns final {x, y, w, h}
      const pw = drag.cont.clientWidth, ph = drag.cont.clientHeight;
      const others = boxes.filter((o) => o !== drag.target);
      const e = { x: s.x, y: s.y, r: s.x + s.w, b: s.y + s.h };
      let { x, y } = e, r = e.r, btm = e.b;
      if (corner.includes('e')) {
        r = e.r + dx;
        for (const o of others) if (yOver(e.y, e.b, o) && o.x >= e.r) r = Math.min(r, o.x);
        r = clamp(r, e.x + 20, pw);
      }
      if (corner.includes('w')) {
        x = e.x + dx;
        for (const o of others) if (yOver(e.y, e.b, o) && o.x + o.w <= e.x) x = Math.max(x, o.x + o.w);
        x = clamp(x, 0, e.r - 20);
      }
      if (corner.includes('s')) {
        btm = e.b + dy;
        for (const o of others) if (xOver(e.x, e.r, o) && o.y >= e.b) btm = Math.min(btm, o.y);
        btm = clamp(btm, e.y + 20, ph);
      }
      if (corner.includes('n')) {
        y = e.y + dy;
        for (const o of others) if (xOver(e.x, e.r, o) && o.y + o.h <= e.y) y = Math.max(y, o.y + o.h);
        y = clamp(y, 0, e.b - 20);
      }
      return { x, y, w: r - x, h: btm - y };
    }

    // ——— doc boxes: swipeable pseudocode / prose pages ———
    function makeDoc(el, pages, swipeable = true) {
      el.innerHTML = '<div class="page"></div>' +
        (swipeable ? '<button class="nav prev">‹</button><button class="nav next">›</button><div class="pager"></div>' : '');
      let page = 0;
      const show = (n) => {
        page = Math.max(0, Math.min(pages.length - 1, n));
        el.querySelector('.page').textContent = pages[page];
        const pager = el.querySelector('.pager');
        if (pager) pager.textContent = (page + 1) + '/' + pages.length;
      };
      const prev = el.querySelector('.prev'), next = el.querySelector('.next');
      if (prev) prev.addEventListener('click', () => show(page - 1));
      if (next) next.addEventListener('click', () => show(page + 1));
      el._show = show;
      el._pages = pages.length;
      show(0);
    }

    const PAGES = [
      `— gesture model —

on pointerdown(box):
  drag = { start: copy(box),
           mode: move | resize,
           corner }        // if a handle

on pointermove:
  dx = ptr.x - drag.px    // TOTAL since start
  geom' = clamp(drag.start, dx, dy)
                         // computed from START
  box := geom'            // never accumulates

on pointerup:
  drag = null             // no barrier persists`,
      `— corner types —

every box exposes 4 typed corners:

  NW   solid to the EAST
  NE   solid to the WEST
  SW   solid to the EAST
  SE   solid to the WEST

(and vertically: N corners
 are solid downward, S upward)

the frame is 4 more corners
at its edges — bounds are
just corners facing you`,
      `— move clamp —

resolve DOMINANT axis first;
the other axis then sees the
updated position.

x = start.x + dx
for o, vertical overlap:
  if dx>0 and o.x >= start.r:
    x = min(x, o.x - w)
  if dx<0 and o.x+o.w <= start.x:
    x = max(x, o.x + o.w)
x = clamp(x, 0, frameW - w)

then y, same shape.`,
      `— resize clamp —

only the moving edge changes;
the stationary edge anchors.

E edge: r = start.r + dx
  for o, vertical overlap,
      o east of us:
    r = min(r, o.x)
  r = clamp(r, start.x+20, frameW)

W, S, N symmetric. Min size
20px throughout.`,
      `— open corners —

flanked on BOTH axes at once,
no ordering escapes: the box
corner-locks until you drag
axis-pure. The honest fix is a
2D corner-contact resolve —
earned when a recorded
trajectory proves it matters.`,
    ];


    const CONTRACT = `The corner contract

A box is not a rectangle of area; it is four points with attitudes. Each corner carries a type — NW, NE, SW, SE — and the type declares which quadrant is solid: an NW corner is solid to its east, an NE to its west, an SW to its east, an SE to its west; north corners are solid downward, south corners upward.

A frame is just four more corners at its edges. So "bounds checking" and "collision" are the same operation: scan every corner that faces your direction of motion, and stop at the nearest one.

Two clauses make the contract honest:

Approach. A corner bounds you only if you approach it. A box sitting to your west never blocks your eastward drag, no matter how close — its east corners point the wrong way. The first draft of this page dropped that clause and boxes teleported; the corner type carries exactly this information, which is the point of typing corners at all.

Order. When a drag moves diagonally, the dominant axis resolves first, and the second axis then measures overlap against the updated position — so a box sliding up-and-out from beside a neighbor is free the moment its edge actually clears, not stuck until you release and re-grab.

One clause is still owed: a box flanked on both axes at once — one neighbor east, another south — can lock in a corner, because no ordering of two 1-dimensional resolutions escapes a 2-dimensional trap. The contract will close when a recorded trajectory earns the full corner-contact resolve: corners meeting corners, not edges sweeping spans.`;

    // ——— gestures: drag in the playground, swipe in doc boxes ———
    let swipe = null;
    plane.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.nav')) return; // let the page buttons click
      const docEl = e.target.closest('.box.doc');
      if (docEl) {
        if (!docEl.querySelector('.pager')) return; // not swipeable (reader)
        swipe = { el: docEl, px: e.clientX, page: +docEl.querySelector('.pager').textContent.split('/')[0] - 1 };
        plane.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
      const boxEl = e.target.closest('.box');
      if (!boxEl) return;
      const i = +boxEl.dataset.i;
      const handle = e.target.closest('.handle');
      drag = handle
        ? { i, mode: 'resize', corner: handle.dataset.corner, px: e.clientX, py: e.clientY, start: { ...boxes[i] }, target: boxes[i], cont: playground }
        : { i, mode: 'move', px: e.clientX, py: e.clientY, start: { ...boxes[i] }, target: boxes[i], cont: playground };
      plane.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    // record: toggle position tracking — snapshot on start, samples while dragging, act on release
    const recordBtn = document.getElementById('record');
    let recording = false;
    async function logEvent(ev) {
      try {
        await fetch('/event', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ actor: 'julian', ...ev }),
        });
      } catch {}
    }
    recordBtn.addEventListener('click', () => {
      recording = !recording;
      recordBtn.textContent = recording ? 'record ●' : 'record ○';
      recordBtn.classList.toggle('active', recording);
      // R3c (ruled 13:35): record is a speech act, not a UI toggle —
      // the start/stop events bracket a demonstration; box geometry
      // snapshots under the span mean 'Julian is showing me something'.
      logEvent({ kind: recording ? 'record_start' : 'record_stop' });
      if (recording) {
        for (const b of boxes) {
          logEvent({ kind: 'box_geometry', name: b.name, geom: { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) } });
        }
      }
    });

    let lastSample = 0;
    plane.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
      const g = drag.mode === 'move'
        ? tryMove(drag.start, dx, dy)
        : tryResize(drag.start, drag.corner, dx, dy);
      Object.assign(boxes[drag.i], g);
      render();
      if (recording && Date.now() - lastSample > 80) {
        lastSample = Date.now();
        const b = boxes[drag.i];
        logEvent({ kind: 'box_drag', name: b.name, geom: { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) } });
      }
    });

    plane.addEventListener('pointerup', (e) => {
      if (swipe) {
        const dx = e.clientX - swipe.px;
        if (Math.abs(dx) > 40) swipe.el._show(swipe.page + (dx < 0 ? 1 : -1));
        swipe = null;
        plane.releasePointerCapture(e.pointerId);
        return;
      }
      if (!drag) return;
      if (recording) {
        const b = boxes[drag.i];
        logEvent({ kind: 'box_geometry', name: b.name, geom: { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) } });
      }
      console.log('box' + drag.i, boxes[drag.i]);
      drag = null;
      plane.releasePointerCapture(e.pointerId);
    });

    const LANDSCAPE = `React, and what we built instead — the landscape

What React does. A component tree owns state in pieces (useState, useReducer); every setState schedules a re-render of the affected subtree; the framework re-runs your components, diffs the result against a virtual DOM, and commits the minimal set of real DOM mutations. The promise is declarativity: UI = f(state), and the framework owns the render loop so you never touch the DOM directly.

What the others do. Solid and Svelte 5 compile away the VDOM: state is fine-grained signals/runes, each with its own subscriber list, and a write to one cell updates exactly the DOM nodes that read it. Vue makes plain objects reactive with proxies. All of them share one assumption: state is in-memory, per-session, and ephemeral — persistence is a bolt-on (a store, a query cache, localStorage), never the state itself.

What we have. The page as it stands already is a hand-rolled reactive framework, one where the assumptions invert:

- the event log is the store — durable, external, shared, append-only
- the fold (when built) is the selector: state = fold(events)
- render() is the commit phase: imperatively patching styles from state
- the 2s poll is the subscription; ?since=N cursors are the diff protocol

So the question this frame holds: is the proposal (a) React (or Solid, or nothing) mounted over an event-log store — log as useSyncExternalStore, folds as selectors, components as projections; or (b) no framework at all — the DOM itself as a projection, boxes as materialized views of log events, gestures writing events directly? And the sub-questions that follow: where does 60Hz gesture state live if state is events (direct manipulation must not round-trip the log per frame — the gesture/act split we already ruled); who owns layout (CSS vs fold); and what hydration means when refresh re-folds the log into geometry.

Julian's proposal and the exploration belong in this frame — annotate, drag, and message; the discussion will be folded in as it happens.

RULING (07:44): vanilla, as an experiment. No framework, no CRDT library — home-roll both, tiny and purpose-built, because forcing the problems through plain JS is how the patterns fall out. The research reports become specs to reimplement, not code to import: automerge's change-unit semantics (id-addressed, property-scoped, LWW-per-property, multi-value registers) as the home-rolled merge target; yjs's state vectors as the diff protocol design; atproto's cursors and lexicons as transport and schema. Everything tonight already went this way by instinct — event store, mirror, collision contract, markdown renderer, frames, probe are all hand-rolled and all tiny. The ruling makes it policy.

THE THREE MACHINES (07:50): the system is layered orthogonal state machines — ENGINE (pi + extension: event hub, pub/sub, delivery semantics, session lifecycle — replaceable, proven by tonight's mid-session engine swap), PRESENTATION (global UI + per-widget: frames, drawers, gestures, chat composing), DOMAIN (the grammar of represented things: message pending→answered, box created→moved→renamed→deleted, tend states). They speak only in events; they tick at different granularities (poll / rAF / event-arrival); presentation never invents domain facts, engine never interprets them. Tonight's worst bugs were crossing violations — engine state (reply-owed) wearing presentation clothes, domain facts (pending/answered) with no machine to track them. The home-rolled framework is scaffolding for these three layers; React only ever addressed the middle one.`;

    // ——— frames: switchable views of the paper ———
    const FRAMES = [
      {
        title: 'geometry · the corner contract',
        build() {
          document.getElementById('frames').innerHTML =
            '<section id="left"><section id="playground"></section><article class="box doc" id="doc"></article></section>' +
            '<section id="right"><article class="box doc reader" id="contract"></article></section>';
          playground = document.getElementById('playground');
          makeDoc(document.getElementById('doc'), PAGES);
          makeDoc(document.getElementById('contract'), [CONTRACT], false);
          boxes[1].x = playground.clientWidth - boxes[1].w - 40;
          render();
        },
      },
      {
        title: 'frameworks · state & projection',
        build() {
          document.getElementById('frames').innerHTML =
            '<section id="left" class="col"><article class="box doc reader" id="fw"></article></section>';
          makeDoc(document.getElementById('fw'), [LANDSCAPE], false);
          playground = null;
        },
      },
      {
        title: 'cards · what paper wants',
        build() {
          document.getElementById('frames').innerHTML =
            '<section id="left" class="col"><div id="cardfield"></div></section>';
          playground = null;
          renderCards();
        },
      },
    ];

    let frame = 0;
    function switchFrame(n) {
      frame = Math.max(0, Math.min(FRAMES.length - 1, n));
      document.getElementById('frame-title').textContent = (frame + 1) + '/' + FRAMES.length + ' · ' + FRAMES[frame].title;
      FRAMES[frame].build();
    }
    document.getElementById('fprev').addEventListener('click', () => switchFrame(frame - 1));
    document.getElementById('fnext').addEventListener('click', () => switchFrame(frame + 1));
    document.addEventListener('keydown', (e) => {
      if (e.target === t) return; // typing in the chat bar
      if (e.key === 'ArrowLeft') switchFrame(frame - 1);
      if (e.key === 'ArrowRight') switchFrame(frame + 1);
    });
    switchFrame(0);

    // ——— meta drawer ———
    const f = document.getElementById('f'),
          t = document.getElementById('t'),
          b = document.getElementById('b'),
          s = document.getElementById('s'),
          log = document.getElementById('log'),
          meta = document.getElementById('meta'),
          toggle = document.getElementById('toggle');

    toggle.addEventListener('click', () => {
      const open = meta.classList.toggle('open');
      toggle.textContent = open ? 'meta ▾' : 'meta ▴';
      if (open) log.scrollTop = log.scrollHeight;
    });

    t.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === '+') {
        e.preventDefault();
        if (e.shiftKey) f.requestSubmit();
      }
    });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = t.value.trim();
      if (!text) return;
      b.disabled = true; s.textContent = '…';
      try {
        const r = await fetch('/message', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error(await r.text());
        t.value = '';
        s.textContent = '✓';
        meta.classList.add('open');
        toggle.textContent = 'meta ▾';
      } catch (err) {
        s.textContent = 'failed';
      } finally {
        b.disabled = false;
        t.focus();
      }
    });

    // tiny markdown subset: code blocks, inline code, bold, italic, links, lists, tables, paragraphs
    function md(src) {
      let s = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      s = s.replace(/```([\s\S]*?)```/g, (_, code) => '<pre>' + code.replace(/^\n|\n$/g, '') + '</pre>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      s = s.replace(/(^|\n)((?:- .*\n?)+)/g, (_, pre, list) =>
        pre + '<ul>' + list.trim().split('\n').map((l) => '<li>' + l.slice(2) + '</li>').join('') + '</ul>');
      // tables: | a | b | rows, second row a --- separator
      s = s.replace(/(^|\n)((?:\|[^\n]*\n?)+)/g, (_, pre, block) => {
        const rows = block.trim().split('\n').map((r) => r.split('|').slice(1, -1).map((c) => c.trim()));
        if (rows.length < 2 || !rows[1].every((c) => /^:?-{3,}:?$/.test(c))) return pre + block;
        const cell = (c, tag) => '<' + tag + '>' + c + '</' + tag + '>';
        let html = '<table><tr>' + rows[0].map((c) => cell(c, 'th')).join('') + '</tr>';
        for (const r of rows.slice(2)) html += '<tr>' + r.map((c) => cell(c, 'td')).join('') + '</tr>';
        return pre + html + '</table>';
      });
      return s.split(/\n{2,}/).map((p) =>
        /^<(ul|pre|table)/.test(p.trim()) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
    }

    // ——— cards: adjudication requests, presented on the plane ———
    // fold: latest card event per id. A card is paper's intent made
    // visible: it wants a ruling; chat (for now) is the reply channel.
    let latest = [];
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    function renderCards() {
      const field = document.getElementById('cardfield');
      if (!field) return;
      const cards = new Map(), responses = new Map();
      for (const e of latest) {
        if (e.kind === 'card') cards.set(e.id, e);
        if (e.kind === 'card_response') {
          if (!responses.has(e.card)) responses.set(e.card, []);
          responses.get(e.card).push(e);
        }
      }
      field.innerHTML = '';
      if (!cards.size) {
        field.innerHTML = '<p class="card-empty">nothing pending — paper wants for nothing.</p>';
        return;
      }
      for (const c of [...cards.values()].reverse()) {
        const resps = responses.get(c.id) || [];
        const ruling = resps.find((r) => r.final === true);
        const discussion = resps.filter((r) => r.final !== true);
        const status = ruling ? 'ruled' : (c.status || 'pending');
        const el = document.createElement('div');
        el.className = 'card ' + status;
        let html = '<div class="card-head"><strong>' + esc(c.title) + '</strong>' +
          '<span class="card-status">' + status + '</span></div>';
        if (c.blurb) html += '<p class="card-blurb">' + esc(c.blurb) + '</p>';
        if (c.table) {
          html += '<table><tr>' + c.table.columns.map((h) => '<th>' + esc(h) + '</th>').join('') + '</tr>';
          for (const r of c.table.rows) html += '<tr>' + r.map((x) => '<td>' + esc(x) + '</td>').join('') + '</tr>';
          html += '</table>';
        }
        if (c.note) html += '<p class="card-note">' + esc(c.note) + '</p>';
        if (c.form && !ruling) {
          html += '<form class="card-form">';
          for (const f of c.form.fields) {
            html += '<div class="card-field"><span class="card-ref">' + f.ref + '</span><span class="card-opts">';
            for (const o of f.options)
              html += '<label><input type="radio" name="' + esc(f.ref) + '" value="' + esc(o.k) + '">' + esc(o.k) + ' — ' + esc(o.label) + '</label>';
            html += '</span></div>';
          }
          html += '<textarea placeholder="write-in: questions, qualifications, anything the options miss"></textarea>';
          html += '<div class="card-buttons"><button type="submit" data-final="1">rule it</button>' +
            '<button type="submit" data-final="0" class="discuss">discuss</button></div></form>';
        }
        for (const d of discussion)
          html += '<p class="card-discuss">▸ ' + esc(d.note || JSON.stringify(d.picks || {})) +
            ' <span class="ts">' + d.ts.slice(11, 19) + '</span></p>';
        if (ruling) {
          const pretty = Object.entries(ruling.picks || {}).map(([k, v]) => k + ': ' + v).join(' · ');
          html += '<p class="card-note">ruled: ' + esc(pretty || '—') + (ruling.note ? ' — ' + esc(ruling.note) : '') + '</p>';
        }
        el.innerHTML = html;
        const formEl = el.querySelector('form');
        if (formEl) formEl.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const picks = {};
          for (const f of c.form.fields) {
            const v = formEl.querySelector('input[name="' + f.ref + '"]:checked');
            if (v) picks[f.ref] = v.value;
          }
          const note = formEl.querySelector('textarea').value.trim();
          const final = ev.submitter?.dataset.final !== '0';
          await fetch('/event', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ kind: 'card_response', card: c.id, picks, note, final, actor: 'julian' }),
          });
          poll();
        });
        field.append(el);
      }
    }

    let seen = -1;
    async function poll() {
      try {
        const events = await (await fetch('/events')).json();
        if (events.length > seen) {
          latest = events;
          renderCards();
          const wasBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
          seen = events.length;
          log.innerHTML = '';
          for (const e of events) {
            if (e.kind !== 'human_message' && e.kind !== 'agent_message') continue;
            const p = document.createElement('p');
            p.className = 'msg ' + (e.kind === 'agent_message' ? 'agent' : 'human');
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = e.kind === 'agent_message' ? 'paper' : 'you';
            const body = document.createElement('span');
            body.className = 'body';
            body.innerHTML = md(e.text);
            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.textContent = e.ts.slice(11, 19);
            p.append(who, body, ts);
            log.append(p);
          }
          if (wasBottom || meta.classList.contains('open')) log.scrollTop = log.scrollHeight;
        }
      } catch {}
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
