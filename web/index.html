<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>malleable-paper</title>
  <link rel="stylesheet" href="/house.css" />
</head>
<body>
  <main id="plane">
    <div class="box" id="box">
      <div class="handle" data-corner="nw"></div>
      <div class="handle" data-corner="ne"></div>
      <div class="handle" data-corner="sw"></div>
      <div class="handle" data-corner="se"></div>
    </div>
  </main>

  <footer id="meta">
    <output id="log" aria-live="polite"></output>
    <form id="f">
      <button type="button" class="toggle" id="toggle">meta ▴</button>
      <input id="t" placeholder="message the paper" autocomplete="off" />
      <button id="b" type="submit">send</button>
      <span class="status" id="s"></span>
    </form>
  </footer>

  <script>
    // ——— box: grab body to move, grab a corner to resize ———
    const plane = document.getElementById('plane');
    const box = document.getElementById('box');
    let geom = { x: 80, y: 80, w: 240, h: 160 }; // plane coordinates
    let drag = null; // { mode: 'move'|'resize', corner, px, py, start }

    function render() {
      box.style.left = geom.x + 'px';
      box.style.top = geom.y + 'px';
      box.style.width = geom.w + 'px';
      box.style.height = geom.h + 'px';
    }

    box.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('.handle');
      drag = handle
        ? { mode: 'resize', corner: handle.dataset.corner, px: e.clientX, py: e.clientY, start: { ...geom } }
        : { mode: 'move', px: e.clientX, py: e.clientY, start: { ...geom } };
      box.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    box.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
      const s = drag.start;
      const pw = plane.clientWidth, ph = plane.clientHeight;
      const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      if (drag.mode === 'move') {
        geom.x = clamp(s.x + dx, 0, pw - s.w);
        geom.y = clamp(s.y + dy, 0, ph - s.h);
      } else {
        // edges: stationary edge anchors, moving edge clamped to plane
        let { x, y, w, h } = s;
        if (drag.corner.includes('e')) w = clamp(s.x + s.w + dx, s.x + 20, pw) - s.x;
        if (drag.corner.includes('s')) h = clamp(s.y + s.h + dy, s.y + 20, ph) - s.y;
        if (drag.corner.includes('w')) x = clamp(s.x + dx, 0, s.x + s.w - 20);
        if (drag.corner.includes('n')) y = clamp(s.y + dy, 0, s.y + s.h - 20);
        w = (drag.corner.includes('w') ? s.x + s.w : s.x + w) - x;
        h = (drag.corner.includes('n') ? s.y + s.h : s.y + h) - y;
        geom = { x, y, w, h };
      }
      render();
    });

    box.addEventListener('pointerup', (e) => {
      if (drag) {
        drag = null;
        box.releasePointerCapture(e.pointerId);
        console.log('box', geom);
      }
    });

    render();

    // ——— meta drawer (unchanged) ———
    const f = document.getElementById('f'),
          t = document.getElementById('t'),
          b = document.getElementById('b'),
          s = document.getElementById('s'),
          log = document.getElementById('log'),
          meta = document.getElementById('meta'),
          toggle = document.getElementById('toggle');

    toggle.addEventListener('click', () => {
      const open = meta.classList.toggle('open');
      toggle.textContent = open ? 'meta ▾' : 'meta ▴';
      if (open) log.scrollTop = log.scrollHeight;
    });

    t.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === '+') {
        e.preventDefault();
        if (e.shiftKey) f.requestSubmit();
      }
    });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = t.value.trim();
      if (!text) return;
      b.disabled = true; s.textContent = '…';
      try {
        const r = await fetch('/message', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error(await r.text());
        t.value = '';
        s.textContent = '✓';
        meta.classList.add('open');
        toggle.textContent = 'meta ▾';
      } catch (err) {
        s.textContent = 'failed';
      } finally {
        b.disabled = false;
        t.focus();
      }
    });

    let seen = -1;
    async function poll() {
      try {
        const events = await (await fetch('/events')).json();
        if (events.length > seen) {
          const wasBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
          seen = events.length;
          log.innerHTML = '';
          for (const e of events) {
            if (e.kind !== 'human_message' && e.kind !== 'agent_message') continue;
            const p = document.createElement('p');
            p.className = e.kind === 'agent_message' ? 'agent' : 'human';
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = e.kind === 'agent_message' ? 'paper' : 'you';
            const text = document.createElement('span');
            text.textContent = e.text;
            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.textContent = e.ts.slice(11, 19);
            p.append(who, text, ts);
            log.append(p);
          }
          if (wasBottom || meta.classList.contains('open')) log.scrollTop = log.scrollHeight;
        }
      } catch {}
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
