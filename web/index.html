<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>malleable-paper</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
    }
    form {
      width: min(640px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      height: 160px;
      padding: 12px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid #000; outline-offset: -1px; }
    button {
      align-self: flex-end;
      padding: 8px 24px;
      border: 1px solid #000;
      border-radius: 0;
      background: #000;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { background: #666; border-color: #666; cursor: default; }
    form { padding-bottom: 48px; }
    .status { min-height: 1.4em; font-size: 13px; color: #000; }
    .log {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 40vh;
      overflow-y: auto;
      padding: 12px 24px;
      border-top: 1px solid #000;
      background: #fff;
      font-size: 14px;
      line-height: 1.5;
    }
    .log .msg { margin: 2px 0; white-space: pre-wrap; }
    .log .who { font-weight: 600; margin-right: 8px; }
    .log .ts { font-size: 11px; color: #666; margin-left: 8px; }
    .log .agent .who::after { content: " · agent"; font-weight: 400; }
  </style>
</head>
<body>
  <form id="f">
    <textarea id="t" placeholder="write" autofocus></textarea>
    <button id="b" type="submit">send</button>
    <div class="status" id="s"></div>
  </form>
  <div class="log" id="log"></div>
  <script>
    const f = document.getElementById('f'),
          t = document.getElementById('t'),
          b = document.getElementById('b'),
          s = document.getElementById('s');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = t.value.trim();
      if (!text) return;
      b.disabled = true; s.textContent = 'sending…';
      try {
        const r = await fetch('/message', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error(await r.text());
        t.value = '';
        s.textContent = 'logged ' + new Date().toLocaleTimeString();
      } catch (err) {
        s.textContent = 'failed: ' + err.message;
      } finally {
        b.disabled = false;
        t.focus();
      }
    });
    const log = document.getElementById('log');
    let seen = -1;
    async function poll() {
      try {
        const events = await (await fetch('/events')).json();
        if (events.length > seen) {
          seen = events.length;
          log.innerHTML = '';
          for (const e of events) {
            if (e.kind !== 'human_message' && e.kind !== 'agent_message') continue;
            const div = document.createElement('div');
            div.className = 'msg ' + (e.kind === 'agent_message' ? 'agent' : 'human');
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = e.kind === 'agent_message' ? 'julian' : 'you';
            const text = document.createElement('span');
            text.textContent = e.text;
            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.textContent = e.ts.slice(11, 19);
            div.append(who, text, ts);
            log.append(div);
          }
          log.scrollTop = log.scrollHeight;
        }
      } catch {}
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
