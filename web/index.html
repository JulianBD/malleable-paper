<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>malleable-paper</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
    }
    form {
      width: min(640px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      height: 160px;
      padding: 12px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid #000; outline-offset: -1px; }
    button {
      align-self: flex-end;
      padding: 8px 24px;
      border: 1px solid #000;
      border-radius: 0;
      background: #000;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { background: #666; border-color: #666; cursor: default; }
    .status { min-height: 1.4em; font-size: 13px; color: #000; }
  </style>
</head>
<body>
  <form id="f">
    <textarea id="t" placeholder="write" autofocus></textarea>
    <button id="b" type="submit">send</button>
    <div class="status" id="s"></div>
  </form>
  <script>
    const f = document.getElementById('f'),
          t = document.getElementById('t'),
          b = document.getElementById('b'),
          s = document.getElementById('s');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = t.value.trim();
      if (!text) return;
      b.disabled = true; s.textContent = 'sending…';
      try {
        const r = await fetch('/message', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error(await r.text());
        t.value = '';
        s.textContent = 'logged ' + new Date().toLocaleTimeString();
      } catch (err) {
        s.textContent = 'failed: ' + err.message;
      } finally {
        b.disabled = false;
        t.focus();
      }
    });
  </script>
</body>
</html>
